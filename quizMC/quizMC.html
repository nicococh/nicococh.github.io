<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Mots-Clés APM - 10 Minutes</title>
  <meta name="description" content="Testez vos connaissances sur les mots-clés de l'APM en 10 minutes. Jeu de quiz interactif, rapide et tolérant aux fautes de frappe.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-content">
        <h1>Quiz Mots-Clés APM</h1>
        <p class="subtitle">Saisissez un maximum de mots-clés du fichier APM en 10 minutes !</p>
      </div>
    </header>

    <main class="game-area">
      <!-- Dashboard of status & control -->
      <!-- Zone collante (sticky) des contrôles de jeu -->
      <div class="sticky-controls glass">
        <section class="control-board">
          <div class="control-actions">
            <button id="btn-start" class="btn btn-primary">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              Commencer le jeu
            </button>
            <button id="btn-give-up" class="btn btn-danger hidden">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="18" height="18">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
              </svg>
              Abandonner
            </button>
          </div>

          <div class="input-container">
            <input type="text" id="word-input" placeholder="Cliquez sur 'Commencer le jeu'..." disabled autocomplete="off" spellcheck="false">
            <div class="input-focus-border"></div>
          </div>

          <div class="stats-panel">
            <div class="stat-item timer-item">
              <span class="stat-label">Temps Restant</span>
              <span id="timer-display" class="stat-value font-mono">10:00</span>
            </div>
            <div class="stat-item score-item">
              <span class="stat-label">Score</span>
              <div class="score-container">
                <span id="score-display" class="stat-value font-mono">0 / 0</span>
                <span id="percentage-display" class="percentage-badge">0%</span>
              </div>
            </div>
          </div>
        </section>

        <!-- Barre de progression de la partie -->
        <div class="progress-bar-container">
          <div id="game-progress" class="progress-bar-fill"></div>
        </div>

        <!-- Barre de navigation rapide A-Z -->
        <nav id="alphabet-nav" class="alphabet-nav" aria-label="Navigation par lettre"></nav>
      </div>

      <!-- Words Grids Section -->
      <section id="grids-container" class="grids-container">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Chargement des mots-clés APM...</p>
        </div>
      </section>


    </main>

    <footer class="app-footer">
      <p>&copy; 2026 APM Quiz Game.</p>
    </footer>

    <!-- End Game Modal -->
    <div id="end-modal" class="modal-overlay hidden">
      <div class="modal-content glass">
        <h2 id="modal-title">Temps écoulé !</h2>
        
        <div class="modal-stats">
          <div class="modal-stat-card">
            <span class="modal-stat-value" id="modal-score">0 / 0</span>
            <span class="modal-stat-label">Mots Trouvés</span>
          </div>
          <div class="modal-stat-card">
            <span class="modal-stat-value" id="modal-percent">0%</span>
            <span class="modal-stat-label">Réussite</span>
          </div>
          <div class="modal-stat-card">
            <span class="modal-stat-value" id="modal-time">10:00</span>
            <span class="modal-stat-label">Temps Écoulé</span>
          </div>
        </div>

        <div class="feedback-message-container">
          <p id="modal-message">Félicitations !</p>
        </div>

        <div class="modal-actions">
          <button id="btn-restart" class="btn btn-primary">Recommencer</button>
          <button id="btn-show-answers" class="btn btn-secondary">Voir les réponses manquées</button>
        </div>
      </div>
    </div>
  </div>

  <script src="keywords.js"></script>
  <script src="app.js"></script>
</body>
</html>
