<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="robots" content="noindex, nofollow" charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Élysée Santé - Comparateur de Programmes Santé</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Clean Top Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand-group">
        <img src="elysee.png" alt="Palais de l'Élysée" class="header-logo">
        <div class="brand-text-group">
          <h1>Élysée Santé 2027 (SITE TEST)</h1>
          <p>Le comparateur des programmes des candidats d'APMnews</p>
        </div>
      </div>
      
      <!-- Right Side Header Group -->
      <div class="header-right-group">
        <!-- Layout Switcher: Single vs Compare -->
        <div class="mode-switcher">
          <button id="btn-mode-single" class="mode-btn active">
            <i data-lucide="user"></i> Par candidat
          </button>
          <button id="btn-mode-compare" class="mode-btn">
            <i data-lucide="columns-2"></i> Comparer
          </button>
        </div>
        <button id="btn-fullscreen" class="mode-btn" type="button" title="Plein écran">
          <i data-lucide="maximize" id="fullscreen-icon-expand"></i>
          <i data-lucide="minimize" id="fullscreen-icon-collapse" style="display:none;"></i>
          <span id="fullscreen-btn-label">Plein écran</span>
        </button>
      </div>
    </div>
  </header>

  <main class="app-container">
    <!-- Info Banner for Second Tour -->
    <div id="second-tour-banner" class="second-tour-banner" style="display: none;">
      <div class="banner-content">
        <span class="banner-badge"><i data-lucide="info" style="width:14px;height:14px;vertical-align:middle;margin-right:4px;"></i>Second Tour</span>
        <span class="banner-text">Le mode Second Tour est actif. Seuls les programmes des candidats finalistes sont affichés.</span>
      </div>
    </div>

    <!-- Candidates Selection Bar -->
    <section class="candidates-selection-section">
      <div class="selection-header-row">
        <h3 id="selection-heading">Sélectionnez un candidat :</h3>
        <button id="btn-toggle-archives" class="archive-toggle-btn" style="display: none;">
          <i data-lucide="archive"></i> <span>Voir les archives (1er tour)</span>
        </button>
      </div>
      <div id="candidates-bar" class="candidates-bar">
        <!-- Dynamically filled with candidate circular selectors -->
      </div>
    </section>

    <!-- Main Content Area -->
    <section id="content-area" class="content-area">
      <!-- VIEW A: Single Candidate full program list -->
      <div id="single-candidate-view" class="single-candidate-view">
        <div id="candidate-identity-card" class="candidate-identity-card">
          <!-- Dynamically populated: Avatar, Name, Party -->
        </div>

        <div id="single-program-anchors" class="single-program-anchors">
          <!-- Dynamically populated category quick links -->
        </div>
        
        <div id="single-program-list" class="single-program-list">
          <!-- Dynamically populated: 9 categories listed vertically -->
        </div>
      </div>

      <!-- VIEW B: Side-by-side Comparative grid -->
      <div id="compare-view" class="compare-view" style="display: none;">
        <!-- Theme Category Filter for comparison -->
        <div id="compare-category-tabs" class="compare-category-tabs">
          <!-- Dynamically populated category tabs -->
        </div>

        <div id="compare-grid" class="compare-grid">
          <!-- Dynamically populated side-by-side columns of selected candidates -->
        </div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <img src="logo_apmnews_h70.png" alt="APMnews" class="footer-logo">
    <p>&copy; 2027 APMnews — Synthèse objective des programmes officiels.</p>
  </footer>

  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script>
    // Bouton Plein écran (n'affecte que ce bouton, aucun autre comportement)
    (function () {
      var btn = document.getElementById('btn-fullscreen');
      var iconExpand = document.getElementById('fullscreen-icon-expand');
      var iconCollapse = document.getElementById('fullscreen-icon-collapse');
      var label = document.getElementById('fullscreen-btn-label');

      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
      }

      function updateButtonState() {
        if (isFullscreen()) {
          iconExpand.style.display = 'none';
          iconCollapse.style.display = '';
          label.textContent = 'Quitter le plein écran';
          btn.classList.add('active');
        } else {
          iconExpand.style.display = '';
          iconCollapse.style.display = 'none';
          label.textContent = 'Plein écran';
          btn.classList.remove('active');
        }
      }

      function enterFullscreen() {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      }

      function exitFullscreen() {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        else if (document.msExitFullscreen) document.msExitFullscreen();
      }

      btn.addEventListener('click', function () {
        if (isFullscreen()) exitFullscreen();
        else enterFullscreen();
      });

      document.addEventListener('fullscreenchange', updateButtonState);
      document.addEventListener('webkitfullscreenchange', updateButtonState);
      document.addEventListener('msfullscreenchange', updateButtonState);
      // La touche Échap déclenche nativement la sortie du plein écran ;
      // on met simplement à jour l'état du bouton via les événements ci-dessus.
    })();
  </script>
</body>
</html>
