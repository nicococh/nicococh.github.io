<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow" charset="utf-8"/>
<title>SupRchariot</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 30px auto;
    padding: 0 20px;
    background: #f5f5f5;
  }
  h1 {
    font-size: 28px;
    color: #003087;
  }
  p.info {
    color: #555;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.5;
  }
  kbd {
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 2px 6px;
    font-family: monospace;
  }
  textarea {
    width: 100%;
    height: 400px;
    box-sizing: border-box;
    font-size: 14px;
    font-family: Arial, sans-serif;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    resize: vertical;
    line-height: 1.4;
  }
  #status {
    margin-top: 8px;
    font-size: 13px;
    color: #2a7a2a;
    min-height: 18px;
  }
  #actionbar {
    margin-top: 6px;
    display: flex;
    gap: 8px;
  }
  #actionbar button {
    font-size: 13px;
    padding: 6px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  #actionbar button:disabled {
    color: #aaa;
    cursor: default;
  }
  #savebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
    font-size: 12px;
    color: #888;
  }
  #savebar button {
    font-size: 12px;
    color: #a33;
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
</style>
</head>
<body>

<h1>À bas les retours chariot&nbsp;!</h1>
<p class="info">
  Collez du texte, sélectionnez des paragraphes puis appuyez sur
  <kbd>Ctrl</kbd> + <kbd>M</kbd> pour supprimer les sauts de ligne. J'enlève aussi les tirets de césure.</p>

<textarea id="editor" placeholder="Collez ou tapez votre texte ici..."> Bla Bla... </textarea>

<div id="actionbar">
  <button id="undoBtn" type="button" disabled>Annuler (Ctrl+Z)</button>
  <button id="redoBtn" type="button" disabled>Rétablir (Ctrl+Y)</button>
</div>

<div id="status"></div>
<div id="savebar">
  <span id="savestatus"></span>
  <button id="clearsave" type="button">Effacer la sauvegarde</button>
</div>

<script>
const editor = document.getElementById('editor');
const status = document.getElementById('status');
const savestatus = document.getElementById('savestatus');
const clearsave = document.getElementById('clearsave');
const undoBtn = document.getElementById('undoBtn');
const redoBtn = document.getElementById('redoBtn');

const STORAGE_KEY = 'editeur-texte-autosave';

// --- Système unifié d'annulation / rétablissement ---
// Couvre à la fois la frappe clavier normale et les nettoyages Ctrl+M.
// On ne s'appuie pas sur l'historique natif du navigateur (qui ne connaît pas
// les modifications faites via setRangeText), on gère donc tout nous-mêmes.

const UNDO_LIMIT = 100;
let undoStack = [];
let redoStack = [];

// Regroupe les frappes rapides et successives en une seule étape d'annulation,
// comme le font la plupart des éditeurs de texte.
let groupeEnCours = false;
let groupeTimeout = null;
const GROUPE_DELAI = 500; // ms de pause avant de considérer qu'un nouveau groupe commence

function etatActuel() {
  return {
    texte: editor.value,
    start: editor.selectionStart,
    end: editor.selectionEnd
  };
}

function mettreAJourBoutons() {
  undoBtn.disabled = undoStack.length === 0;
  redoBtn.disabled = redoStack.length === 0;
}

function empilerUndo(etat) {
  undoStack.push(etat);
  if (undoStack.length > UNDO_LIMIT) {
    undoStack.shift();
  }
  // Toute nouvelle action invalide la pile de rétablissement
  redoStack = [];
  mettreAJourBoutons();
}

function terminerGroupe() {
  groupeEnCours = false;
  clearTimeout(groupeTimeout);
  groupeTimeout = null;
}

function annuler() {
  if (undoStack.length === 0) {
    status.textContent = "Rien à annuler.";
    return;
  }
  redoStack.push(etatActuel());
  if (redoStack.length > UNDO_LIMIT) {
    redoStack.shift();
  }
  const precedent = undoStack.pop();
  editor.value = precedent.texte;
  editor.setSelectionRange(precedent.start, precedent.end);
  terminerGroupe();
  mettreAJourBoutons();
  status.textContent = "Dernière action annulée.";
  editor.focus();
  sauvegarder();
}

function retablir() {
  if (redoStack.length === 0) {
    status.textContent = "Rien à rétablir.";
    return;
  }
  undoStack.push(etatActuel());
  if (undoStack.length > UNDO_LIMIT) {
    undoStack.shift();
  }
  const suivant = redoStack.pop();
  editor.value = suivant.texte;
  editor.setSelectionRange(suivant.start, suivant.end);
  terminerGroupe();
  mettreAJourBoutons();
  status.textContent = "Action rétablie.";
  editor.focus();
  sauvegarder();
}

undoBtn.addEventListener('click', annuler);
redoBtn.addEventListener('click', retablir);

// Capture l'état AVANT chaque modification déclenchée par l'utilisateur
// (frappe, collage, glisser-déposer, correction orthographique, etc.)
editor.addEventListener('beforeinput', function() {
  if (!groupeEnCours) {
    empilerUndo(etatActuel());
    groupeEnCours = true;
  }
  clearTimeout(groupeTimeout);
  groupeTimeout = setTimeout(terminerGroupe, GROUPE_DELAI);
});

// --- Sauvegarde automatique ---

function formatHeure(date) {
  return date.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function sauvegarder() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      texte: editor.value,
      date: new Date().toISOString()
    }));
    savestatus.textContent = "Sauvegardé automatiquement à " + formatHeure(new Date());
  } catch (err) {
    savestatus.textContent = "Échec de la sauvegarde automatique (mémoire du navigateur pleine ?).";
  }
}

let saveTimeout = null;
function planifierSauvegarde() {
  savestatus.textContent = "Modification en cours...";
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(sauvegarder, 800); // sauvegarde 0.8s après la dernière frappe
}

// Restauration au chargement de la page
window.addEventListener('DOMContentLoaded', function() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      if (data.texte && data.texte !== editor.value) {
        const confirmer = confirm(
          "Un texte sauvegardé automatiquement a été trouvé (dernière sauvegarde : " +
          formatHeure(new Date(data.date)) +
          "). Voulez-vous le restaurer et remplacer le contenu actuel de l'éditeur ?"
        );
        if (confirmer) {
          editor.value = data.texte;
          status.textContent = "Texte restauré depuis la sauvegarde automatique.";
          // Nouveau point de départ : on repart avec des piles vides
          undoStack = [];
          redoStack = [];
          mettreAJourBoutons();
        }
      }
      savestatus.textContent = "Dernière sauvegarde : " + formatHeure(new Date(data.date));
    }
  } catch (err) {
    // pas de sauvegarde valide, on ignore
  }
});

editor.addEventListener('input', planifierSauvegarde);

// Sauvegarde immédiate si l'utilisateur quitte/ferme la page
window.addEventListener('beforeunload', sauvegarder);

// Effacer la sauvegarde manuellement
clearsave.addEventListener('click', function() {
  if (confirm("Effacer la sauvegarde automatique enregistrée dans ce navigateur ?")) {
    localStorage.removeItem(STORAGE_KEY);
    savestatus.textContent = "Sauvegarde effacée.";
  }
});

function nettoyerTexte(selectedText) {
  let lastChar = "";
  let text = selectedText;

  // Si la sélection se termine par un saut de ligne, on le conserve à part
  if (text.endsWith("\n")) {
    lastChar = "\n";
    text = text.slice(0, -1);
  }

  // Remplacer tous les sauts de ligne (\r\n, \r, \n) par des espaces
  text = text.replace(/\r\n|\r|\n/g, " ");

  // Remettre le dernier saut de ligne s'il y en avait un
  text = text + lastChar;

  // Corriger les césures : "mot- suite" -> "motsuite"
  text = text.replace(/- /g, "");

  // Supprimer les doubles espaces (et plus), en préservant un éventuel \n final
  // On traite la partie sans le \n final séparément pour ne pas le manger
  if (text.endsWith("\n")) {
    let body = text.slice(0, -1);
    body = body.replace(/ {2,}/g, " ");
    text = body + "\n";
  } else {
    text = text.replace(/ {2,}/g, " ");
  }

  return text;
}

editor.addEventListener('keydown', function(e) {
  const isCtrlM = (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'm' || e.key === 'M');
  const isCtrlZ = (e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'z' || e.key === 'Z');
  const isCtrlY = (e.ctrlKey || e.metaKey) && !e.altKey &&
    ((!e.shiftKey && (e.key === 'y' || e.key === 'Y')) || (e.shiftKey && (e.key === 'z' || e.key === 'Z')));

  if (isCtrlM) {
    e.preventDefault(); // empêche l'ouverture d'un nouvel onglet

    const start = editor.selectionStart;
    const end = editor.selectionEnd;

    if (start === end) {
      status.textContent = "Aucune sélection : sélectionnez du texte avec la souris avant Ctrl+M.";
      return;
    }

    const value = editor.value;
    const selectedText = value.substring(start, end);
    const cleaned = nettoyerTexte(selectedText);

    // setRangeText ne déclenche pas 'beforeinput', on empile donc l'état
    // précédent nous-mêmes, et on clôt le groupe de frappe en cours.
    empilerUndo(etatActuel());
    terminerGroupe();

    // Remplacer la sélection par le texte nettoyé
    editor.setRangeText(cleaned, start, end, 'select');

    status.textContent = "Sauts de ligne supprimés dans la sélection (" + selectedText.length + " → " + cleaned.length + " caractères).";
    editor.focus();
    sauvegarder();
    return;
  }

  if (isCtrlZ) {
    e.preventDefault();
    annuler();
    return;
  }

  if (isCtrlY) {
    e.preventDefault();
    retablir();
    return;
  }
});

mettreAJourBoutons();
</script>

</body>
</html>
